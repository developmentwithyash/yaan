<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Canvas -->
    <radialGradient id="bgTypo" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="45%" stop-color="#0c0d11"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>

    <!-- Warm Golden Luxury / Brushed Amber Gradients -->
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE"/>
      <stop offset="30%" stop-color="#E8C366"/>
      <stop offset="70%" stop-color="#B88A2E"/>
      <stop offset="100%" stop-color="#7A5610"/>
    </linearGradient>

    <linearGradient id="goldFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5BE5E"/>
      <stop offset="60%" stop-color="#FCEAB3"/>
      <stop offset="100%" stop-color="#D4A737"/>
    </linearGradient>

    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F4F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Architectural Grid Background Pattern -->
    <pattern id="typoGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#181B24" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#242838"/>
    </pattern>

    <!-- Subtle Luminous Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="1600" height="1200" rx="36" fill="url(#bgTypo)"/>
  <rect width="1600" height="1200" fill="url(#typoGrid)" opacity="0.45"/>

  <!-- Master Framing Border -->
  <rect x="24" y="24" width="1552" height="1152" rx="24" fill="none" stroke="#242A38" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="24" cy="24" r="4" fill="#D4A737" opacity="0.8"/>
  <circle cx="1576" cy="24" r="4" fill="#D4A737" opacity="0.8"/>
  <circle cx="24" cy="1176" r="4" fill="#D4A737" opacity="0.8"/>
  <circle cx="1576" cy="1176" r="4" fill="#D4A737" opacity="0.8"/>

  <!-- ============================================================== -->
  <!-- HEADER SPECIFICATIONS                                          -->
  <!-- ============================================================== -->
  <g transform="translate(100, 95)">
    <rect x="0" y="0" width="170" height="26" rx="6" fill="#1C1E26" stroke="#2A2E3D" stroke-width="1"/>
    <text x="85" y="17" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#E8C366" text-anchor="middle">BESPOKE TYPOGRAPHY</text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">Architectural Monogram &amp; Typographic Wordmark</text>
    <text x="0" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5" fill="#8E99AC">Custom-sculpted letterforms, calibrated optical kerning, and integrated structural monogram</text>
  </g>

  <!-- ============================================================== -->
  <!-- CENTERPIECE: THE BESPOKE MONOGRAM (YS ARCHITECTURAL APEX)      -->
  <!-- ============================================================== -->
  <g transform="translate(800, 390)">
    <!-- Monogram Radial Aura -->
    <circle cx="0" cy="0" r="140" fill="#E8C366" opacity="0.04" filter="url(#softGlow)"/>

    <!-- Standalone Typographic Monogram Icon: Sculpted Architectural YS -->
    <!-- Left Angled Wing of Y (Sculpted Chamfer Stroke) -->
    <path d="M -110 -130 L -50 -130 L 0 -35 L -35 -20 Z" fill="url(#silverPlate)"/>
    
    <!-- Right Angled Wing of Y (Warm Gold Facet) -->
    <path d="M 110 -130 L 50 -130 L 0 -35 L 35 -20 Z" fill="url(#goldStem)"/>

    <!-- Central Interlocking S Tier 1: Sweeping Cantilever Cross-tier -->
    <path d="M -75 -15 L 75 -15 L 75 15 L -20 15 L -20 40 L 75 40 L 75 75 L -75 75 L -75 45 L 20 45 L 20 20 L -75 20 Z" fill="url(#silverPlate)"/>

    <!-- Stem of Y / Grounded Column Anchor -->
    <path d="M -18 75 L 18 75 L 18 135 L -18 135 Z" fill="url(#goldFacet)"/>

    <!-- Optical Core Node in Intentional Negative Space -->
    <circle cx="0" cy="-28" r="7" fill="#E8C366"/>

    <!-- Monogram Foundation Step / Architectural Shelf -->
    <rect x="-95" y="145" width="190" height="6" rx="3" fill="#D4A737"/>
  </g>

  <!-- ============================================================== -->
  <!-- PRIMARY TYPOGRAPHIC WORDMARK: YAANSTACK                         -->
  <!-- Engineered with custom geometric cuts and precise kerning      -->
  <!-- ============================================================== -->
  <g transform="translate(800, 690)" text-anchor="middle">
    <!-- "YAAN" - Sculpted Display Geometry in Titanium White -->
    <!-- Custom drawn glyph paths for YAAN to prove true bespoke craftsmanship -->
    
    <!-- Combined Typographic Display String -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="78" font-weight="900" letter-spacing="12" fill="#FFFFFF">
      YAAN<tspan fill="#E8C366" font-weight="300" letter-spacing="14">STACK</tspan>
    </text>

    <!-- Architectural Micro-Divider with Calibrated Kerning Marks -->
    <g transform="translate(0, 35)">
      <line x1="-280" y1="0" x2="280" y2="0" stroke="#262B3A" stroke-width="1.5"/>
      <circle cx="-280" cy="0" r="3" fill="#D4A737"/>
      <circle cx="280" cy="0" r="3" fill="#D4A737"/>
      <rect x="-8" y="-4" width="16" height="8" rx="2" fill="#E8C366"/>
    </g>

    <!-- Corporate Classification Subtitle -->
    <text x="0" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="8" fill="#8E99AC">
      INTELLIGENT SYSTEMS &amp; INFRASTRUCTURE
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- FOOTER: TYPOGRAPHIC BENCHMARKS & COLOR MATRIX                  -->
  <!-- ============================================================== -->
  <g transform="translate(100, 930)">
    <rect width="1400" height="170" rx="16" fill="#0F1015" stroke="#1F2330" stroke-width="1.2"/>

    <!-- Column 1: Monogram Isolation (Small Format Scaling) -->
    <g transform="translate(45, 30)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#E8C366">STANDALONE MONOGRAM (48PX)</text>
      <g transform="translate(0, 18)">
        <rect width="64" height="64" rx="14" fill="#14161F" stroke="#282E40" stroke-width="1"/>
        <!-- Scaled Mini Glyphs -->
        <g transform="translate(32, 32) scale(0.18)">
          <path d="M -110 -130 L -50 -130 L 0 -35 L -35 -20 Z" fill="#FFFFFF"/>
          <path d="M 110 -130 L 50 -130 L 0 -35 L 35 -20 Z" fill="#E8C366"/>
          <path d="M -75 -15 L 75 -15 L 75 15 L -20 15 L -20 40 L 75 40 L 75 75 L -75 75 L -75 45 L 20 45 L 20 20 L -75 20 Z" fill="#FFFFFF"/>
          <path d="M -18 75 L 18 75 L 18 135 L -18 135 Z" fill="#E8C366"/>
          <rect x="-95" y="145" width="190" height="10" rx="4" fill="#E8C366"/>
        </g>
        <text x="80" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">YS Corporate Mark</text>
        <text x="80" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#8E99AC">Sharp vector legibility at app icon / favicon size</text>
      </g>
    </g>

    <!-- Column 2: Light Background Preview -->
    <g transform="translate(580, 30)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#E8C366">LIGHT BACKGROUND LOCKUP</text>
      <g transform="translate(0, 18)">
        <rect width="360" height="64" rx="10" fill="#FAF9F5" stroke="#E2E8F0" stroke-width="1"/>
        <g transform="translate(30, 36) scale(0.14)">
          <path d="M -110 -130 L -50 -130 L 0 -35 L -35 -20 Z" fill="#0C0D11"/>
          <path d="M 110 -130 L 50 -130 L 0 -35 L 35 -20 Z" fill="#B88A2E"/>
          <path d="M -75 -15 L 75 -15 L 75 15 L -20 15 L -20 40 L 75 40 L 75 75 L -75 75 L -75 45 L 20 45 L 20 20 L -75 20 Z" fill="#0C0D11"/>
          <path d="M -18 75 L 18 75 L 18 135 L -18 135 Z" fill="#B88A2E"/>
        </g>
        <text x="65" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="3" fill="#0C0D11">
          YAAN<tspan fill="#B88A2E" font-weight="400">STACK</tspan>
        </text>
      </g>
    </g>

    <!-- Column 3: Typographic Kerning & Construction Metrics -->
    <g transform="translate(1030, 30)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#E8C366">TYPE SPECS &amp; PROPORTIONS</text>
      <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Font: <tspan font-weight="400" fill="#CBD5E1">Plus Jakarta Sans Display (Geometric)</tspan></text>
      <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Weight Cadence: <tspan font-weight="400" fill="#CBD5E1">YAAN 900 / STACK 300</tspan></text>
      <text x="0" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Optical Tracking: <tspan font-weight="400" fill="#CBD5E1">+12 em (YAAN) · +14 em (STACK)</tspan></text>
    </g>
  </g>
</svg>