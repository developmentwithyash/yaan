name: Release Build & Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Build Desktop Runnable Uber JAR
        run: |
          ./gradlew :composeApp:packageUberJarForCurrentOS --stacktrace
          mkdir -p artifacts
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk artifacts/YAAN-android-debug.apk
          cp composeApp/build/compose/jars/*.jar artifacts/composeApp-desktop.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/YAAN-android-debug.apk
            artifacts/composeApp-desktop.jar
          name: YAAN Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
