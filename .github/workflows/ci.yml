name: CI Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Multiplatform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Code Style & Static Analysis Linter
        run: ./gradlew lintCheck --stacktrace

      - name: Run Multiplatform Unit Tests
        run: ./gradlew test --stacktrace

      - name: Run Backend Tests
        run: ./gradlew :backend:test --stacktrace

      - name: Build Android Debug APK & Desktop Uber JAR
        run: ./gradlew :composeApp:assembleDebug :composeApp:packageUberJarForCurrentOS --stacktrace

      - name: Publish Binary Size & Dependency Report
        run: |
          chmod +x scripts/binary_size_report.sh
          ./scripts/binary_size_report.sh
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
