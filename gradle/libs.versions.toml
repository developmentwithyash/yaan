[versions]
# ── Kotlin & KMP ──────────────────────────────────────────────────────────
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.27"

# ── Compose ───────────────────────────────────────────────────────────────
compose-plugin          = "1.7.0"
compose-compiler        = "1.5.15"

# ── Android ───────────────────────────────────────────────────────────────
agp                     = "8.7.0"
android-minSdk          = "26"
android-targetSdk       = "35"
android-compileSdk      = "35"

# ── AndroidX ──────────────────────────────────────────────────────────────
androidx-core-ktx       = "1.15.0"
androidx-lifecycle      = "2.8.7"
androidx-activity-compose = "1.9.3"
androidx-work           = "2.10.0"

# ── DI ────────────────────────────────────────────────────────────────────
koin                    = "4.0.0"
koin-compose            = "4.0.0"

# ── Networking ────────────────────────────────────────────────────────────
ktor                    = "3.0.1"
kotlinx-serialization   = "1.7.3"

# ── Storage ───────────────────────────────────────────────────────────────
sqldelight              = "2.0.2"
datastore               = "1.1.1"

# ── Navigation ────────────────────────────────────────────────────────────
navigation-compose      = "2.8.3"

# ── Coroutines ────────────────────────────────────────────────────────────
kotlinx-coroutines      = "1.9.0"

# ── Date/Time ─────────────────────────────────────────────────────────────
kotlinx-datetime        = "0.6.1"

# ── Logging ───────────────────────────────────────────────────────────────
napier                  = "2.7.1"

# ── Testing ───────────────────────────────────────────────────────────────
kotlin-test             = "2.0.21"
turbine                 = "1.2.0"
mockk                   = "1.13.12"
kotest                  = "5.9.1"

[libraries]
# ── Kotlin ────────────────────────────────────────────────────────────────
kotlin-test                         = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin-test" }
kotlin-test-junit                   = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-test" }

# ── Coroutines ────────────────────────────────────────────────────────────
kotlinx-coroutines-core             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# ── Serialization ─────────────────────────────────────────────────────────
kotlinx-serialization-json          = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# ── Date/Time ─────────────────────────────────────────────────────────────
kotlinx-datetime                    = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# ── Compose Multiplatform ─────────────────────────────────────────────────
compose-ui                          = { module = "androidx.compose.ui:ui" }
compose-ui-tooling                  = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview          = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation                  = { module = "androidx.compose.foundation:foundation" }
compose-material3                   = { module = "androidx.compose.material3:material3" }
compose-material-icons              = { module = "androidx.compose.material:material-icons-extended" }
compose-runtime                     = { module = "androidx.compose.runtime:runtime" }

# ── AndroidX ──────────────────────────────────────────────────────────────
androidx-core-ktx                   = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime          = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel        = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose           = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-work-runtime               = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }

# ── Navigation ────────────────────────────────────────────────────────────
navigation-compose                  = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# ── DI — Koin ─────────────────────────────────────────────────────────────
koin-core                           = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android                        = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose                        = { module = "io.insert-koin:koin-compose", version.ref = "koin-compose" }
koin-compose-viewmodel              = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin-compose" }
koin-test                           = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# ── Ktor ──────────────────────────────────────────────────────────────────
ktor-client-core                    = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-android                 = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-darwin                  = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation     = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json     = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging                 = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-auth                    = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-mock                    = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# ── Ktor Server ───────────────────────────────────────────────────────────
ktor-server-core                    = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty                   = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-cio                     = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation     = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors                    = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-call-logging            = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-status-pages            = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-websockets              = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-test-host               = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# ── SQLDelight ────────────────────────────────────────────────────────────
sqldelight-runtime                  = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver           = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver            = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-coroutines               = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# ── DataStore ─────────────────────────────────────────────────────────────
datastore-preferences               = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ── Logging ───────────────────────────────────────────────────────────────
napier                              = { module = "io.github.aakira:napier", version.ref = "napier" }

# ── Testing ───────────────────────────────────────────────────────────────
turbine                             = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk                               = { module = "io.mockk:mockk", version.ref = "mockk" }
kotest-assertions                   = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

[plugins]
kotlinMultiplatform                 = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinCocoapods                     = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
androidApplication                  = { id = "com.android.application", version.ref = "agp" }
androidLibrary                      = { id = "com.android.library", version.ref = "agp" }
jetbrainsCompose                    = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler                    = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlinxSerialization                = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight                          = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
